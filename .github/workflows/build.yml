name: Build Windows EXE

on:
  push:
    branches: [ "main" ]  # 如果你的主分支叫 master，请把这里改成 master
  workflow_dispatch:      # 允许你在 GitHub 网页端手动点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'  # 3.10 具有极好的 PyQt6 和 PyInstaller 兼容性

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 强制安装所有必须的第三方库，确保打包环境绝对不缺依赖
        pip install PyQt6 pandas openpyxl pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # --noconsole: 隐藏黑框控制台
        # --onefile: 打包成单体 exe 文件
        # --hidden-import: 强制 PyInstaller 抓取 pandas 和 openpyxl 底层文件
        # --name: 指定最终生成的 exe 名称
        pyinstaller --noconsole --onefile --hidden-import=pandas --hidden-import=openpyxl --name 4444 4444.py

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: 4444-EXE-Program
        path: dist/4444.exe
